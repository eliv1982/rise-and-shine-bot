# Локально: docker compose up --build -d
# Docker Hub: в .env задай DOCKERHUB_IMAGE=логин/rise-and-shine-bot:latest, затем на сервере:
#   docker compose pull && docker compose up -d
services:
  bot:
    image: ${DOCKERHUB_IMAGE:-rise-and-shine-bot:latest}
    build: .
    container_name: rise-and-shine-bot
    restart: unless-stopped
    # SIGTERM stops polling and the scheduler without waiting for an in-flight
    # scheduled delivery to finish (see bot.py's shutdown hook / scheduler.py's
    # module docstring): the durable claim lease reclaims and retries it after
    # restart instead. 30s is margin for that orderly-but-not-waiting teardown
    # to complete without being cut off by SIGKILL - not a wait for the 600s
    # per-attempt timeout.
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - bot_data:/app/data
    environment:
      - BOT_DATA_DIR=/app/data
    working_dir: /app

volumes:
  bot_data:
